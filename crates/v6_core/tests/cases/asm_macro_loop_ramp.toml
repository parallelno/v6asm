# Tests that global labels in a macro body are namespaced per invocation.
# The second invocation no longer collides: each gets its own
# `MakeBlock_<call-index>.BlockStart` / `.BlockEnd` namespace.

[files]
"main.asm" = '''
.macro MakeBlock(count)
BlockStart:
    .loop count
        db 0x70
    .endloop
BlockEnd:
.endmacro

.org 0x0310
MakeBlock(2)
MakeBlock(3)
'''

[expect]
rom = "70 70 70 70 70"
min_addr = "0310"


# Tests that constants defined in a macro body are scoped per invocation.
# Each invocation gets its own namespace (`MacroName_<call-index>.C`), so the
# two calls below do not collide with each other or with the outer `C = 9`.

[files]
"main.asm" = '''
.macro EmitConst(val)
C = val
DB C
.endmacro

C = 9

EmitConst(1)
EmitConst(5)
'''

[expect]
rom = "01 05"

